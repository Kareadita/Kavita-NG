<h1>Popover and tooltip</h1>
<p class="lead">Popover and tooltip markup, shown inline.</p>

<section>
  <h2 class="h5">Popover</h2>
  <div class="popover bs-popover-bottom position-relative d-block">
    <div class="popover-arrow"></div>
    <h3 class="popover-header">Popover header</h3>
    <div class="popover-body">Popover body</div>
  </div>
</section>

<section class="mt-4">
  <h2 class="h5">Tooltip</h2>
  <div class="tooltip bs-tooltip-top show position-relative d-inline-block" role="tooltip">
    <div class="tooltip-inner">Tooltip text</div>
  </div>
</section>
