<h1>Inputs</h1>
<p class="lead">Text inputs and selects.</p>

<div class="row g-3">
  <div class="col-md-6">
    <label class="form-label" for="demo-input">Text input</label>
    <input id="demo-input" class="form-control" placeholder="Placeholder" />
    <div class="form-text">Helper text under an input</div>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="demo-readonly">Read-only input</label>
    <input id="demo-readonly" class="form-control" value="Read-only value" readonly />
  </div>
  <div class="col-md-6">
    <label class="form-label" for="demo-disabled">Disabled input</label>
    <input id="demo-disabled" class="form-control" value="Disabled value" disabled />
  </div>
  <div class="col-md-6">
    <label class="form-label" for="demo-select">Select</label>
    <select id="demo-select" class="form-select">
      <option>First option</option>
      <option>Second option</option>
    </select>
  </div>
</div>
