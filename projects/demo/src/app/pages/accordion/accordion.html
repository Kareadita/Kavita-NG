<h1>Accordion</h1>
<p class="lead">Bootstrap accordion markup. The kng-accordion component arrives in phase 3.</p>

<div class="accordion">
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button type="button" class="accordion-button">Open item</button>
    </h2>
    <div class="accordion-collapse collapse show">
      <div class="accordion-body">Body content of the open item</div>
    </div>
  </div>
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button type="button" class="accordion-button collapsed">Collapsed item</button>
    </h2>
  </div>
</div>
