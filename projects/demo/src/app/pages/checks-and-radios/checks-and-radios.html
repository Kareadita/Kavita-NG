<h1>Checks and radios</h1>
<p class="lead">Checkboxes, switches and radio buttons.</p>

<div class="form-check">
  <input id="demo-check" class="form-check-input" type="checkbox" checked />
  <label class="form-check-label" for="demo-check">Checked checkbox</label>
</div>
<div class="form-check">
  <input id="demo-check-off" class="form-check-input" type="checkbox" />
  <label class="form-check-label" for="demo-check-off">Unchecked checkbox</label>
</div>
<div class="form-check form-switch">
  <input id="demo-switch" class="form-check-input" type="checkbox" role="switch" checked />
  <label class="form-check-label" for="demo-switch">Switch</label>
</div>
<div class="form-check">
  <input id="demo-radio-a" class="form-check-input" type="radio" name="demo-radio" checked />
  <label class="form-check-label" for="demo-radio-a">First radio</label>
</div>
<div class="form-check">
  <input id="demo-radio-b" class="form-check-input" type="radio" name="demo-radio" />
  <label class="form-check-label" for="demo-radio-b">Second radio</label>
</div>
