<h1>Pagination</h1>
<p class="lead">Page links with active and disabled states.</p>

<ul class="pagination">
  <li class="page-item disabled"><span class="page-link">Previous</span></li>
  <li class="page-item active"><span class="page-link">1</span></li>
  <li class="page-item"><a class="page-link" href="#" (click)="$event.preventDefault()">2</a></li>
  <li class="page-item">
    <a class="page-link" href="#" (click)="$event.preventDefault()">Next</a>
  </li>
</ul>
