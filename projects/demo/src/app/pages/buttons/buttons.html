<h1>Buttons</h1>
<p class="lead">Solid, outline and text-only variants, plus icon and action buttons.</p>

<section>
  <h2 class="h5">Solid</h2>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <button type="button" class="btn btn-primary">btn-primary</button>
    <button type="button" class="btn btn-secondary">btn-secondary</button>
    <button type="button" class="btn btn-secondary alt">btn-secondary alt</button>
    <button type="button" class="btn btn-warning">btn-warning</button>
    <button type="button" class="btn btn-danger">btn-danger</button>
    <button type="button" class="btn btn-primary" disabled>disabled</button>
  </div>
</section>

<section class="mt-4">
  <h2 class="h5">Outline</h2>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <button type="button" class="btn btn-outline-primary">btn-outline-primary</button>
    <button type="button" class="btn btn-outline-secondary">btn-outline-secondary</button>
    <button type="button" class="btn btn-outline-warning">btn-outline-warning</button>
    <button type="button" class="btn btn-outline-danger">btn-outline-danger</button>
  </div>
</section>

<section class="mt-4">
  <h2 class="h5">Text only</h2>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <button type="button" class="btn btn-primary-text">btn-primary-text</button>
    <button type="button" class="btn btn-secondary-text">btn-secondary-text</button>
    <button type="button" class="btn btn-warning-text">btn-warning-text</button>
    <button type="button" class="btn btn-danger-text">btn-danger-text</button>
    <button type="button" class="btn btn-link">btn-link</button>
  </div>
</section>

<section class="mt-4">
  <h2 class="h5">Actions and close</h2>
  <div class="d-flex flex-wrap align-items-center gap-2">
    <button type="button" class="btn btn-actions">btn-actions</button>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>
</section>
