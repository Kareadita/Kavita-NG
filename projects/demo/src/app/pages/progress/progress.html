<h1>Progress</h1>
<p class="lead">Plain and striped progress bars.</p>

<div
  class="progress"
  role="progressbar"
  aria-label="Progress"
  aria-valuenow="60"
  aria-valuemin="0"
  aria-valuemax="100"
>
  <div class="progress-bar w-60"></div>
</div>
<div
  class="progress mt-3"
  role="progressbar"
  aria-label="Striped progress"
  aria-valuenow="40"
  aria-valuemin="0"
  aria-valuemax="100"
>
  <div class="progress-bar progress-bar-striped progress-bar-animated w-40"></div>
</div>
