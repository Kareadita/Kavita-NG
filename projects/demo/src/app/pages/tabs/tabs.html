<h1>Tabs</h1>
<p class="lead">Tabs and pills on Bootstrap nav markup.</p>

<section>
  <h2 class="h5">Tabs</h2>
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" (click)="$event.preventDefault()">Active</a>
    </li>
    <li class="nav-item"><a class="nav-link" href="#" (click)="$event.preventDefault()">Tab</a></li>
    <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">Disabled</a></li>
  </ul>
</section>

<section class="mt-4">
  <h2 class="h5">Pills</h2>
  <ul class="nav nav-pills">
    <li class="nav-item">
      <a class="nav-link active" href="#" (click)="$event.preventDefault()">Active</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" (click)="$event.preventDefault()">Pill</a>
    </li>
  </ul>
</section>
