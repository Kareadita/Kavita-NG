name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./projects/kavita-ng/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi
      - run: npx ng build kavita-ng
      # Uses npm trusted publishing (OIDC), configured on npmjs.com for this repo and workflow
      - run: npm publish --access public
        working-directory: dist/kavita-ng
